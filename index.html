
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScanPet | Identificación de mascotas</title>
  <meta name="description" content="ScanPet ayuda a identificar mascotas mediante un código QR o NFC.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f0f7ff;
      color: #183153;
    }
    main {
      max-width: 520px;
      width: 100%;
      padding: 36px 24px;
      background: white;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 30px #18315312;
    }
    .paw { font-size: 58px; }
    h1 { color: #1769aa; margin-bottom: 12px; }
    p { line-height: 1.6; color: #53657b; }
  </style>
</head>
<body>
  <main>
    <div class="paw">🐾</div>
    <h1>ScanPet</h1>
    <p>Identificación inteligente para tu mascota.</p>
    <p>Estamos preparando un espacio para que puedas ayudar a tu mascota a regresar a casa si se pierde.</p>
  </main>
</body>
</html>
